name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SpendMeter.html'
      - 'app/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check signing key is set up
        id: check
        working-directory: .
        env:
          SM_KEYSTORE_B64: ${{ secrets.SM_KEYSTORE_B64 }}
        run: |
          if [ -z "$SM_KEYSTORE_B64" ]; then
            echo "::warning::Signing key secrets are not added yet - skipping the APK build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Prepare web files (bundle Firebase so the app opens offline)
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p www
          cp ../SpendMeter.html www/index.html
          for m in app auth firestore; do
            cp node_modules/firebase/firebase-$m-compat.js www/
            sed -i "s#https://www.gstatic.com/firebasejs/[0-9.]*/firebase-$m-compat.js#firebase-$m-compat.js#" www/index.html
          done
          test "$(grep -c 'src="firebase-' www/index.html)" = "3"
      - name: Create Android project
        if: steps.check.outputs.ready == 'true'
        run: |
          npx cap add android
          cp google-services.json android/app/
          python3 patch_android.py ${{ github.run_number }}
          # Copy pre-built icons directly - bypasses @capacitor/assets generate
          for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            dest="android/app/src/main/res/$density"
            mkdir -p "$dest"
            cp "prebuilt-icons/$density/ic_launcher.png" "$dest/ic_launcher.png"
            cp "prebuilt-icons/$density/ic_launcher_round.png" "$dest/ic_launcher_round.png"
          done
          # Fix PNG icons with Python Pillow to prevent AAPT2 daemon crash
          python3 << 'PYEOF'
          import os, glob
          try:
              from PIL import Image
          except ImportError:
              import subprocess
              subprocess.run(["pip3","install","Pillow","-q"], check=True)
              from PIL import Image
          for f in glob.glob("android/app/src/main/res/**/*.png", recursive=True):
              img = Image.open(f).convert("RGBA")
              tmp = f + ".new"
              img.save(tmp, "PNG")
              os.replace(tmp, f)
          PYEOF
          npx cap sync android
      - name: Build signed APK
        if: steps.check.outputs.ready == 'true'
        env:
          SM_KEYSTORE_B64: ${{ secrets.SM_KEYSTORE_B64 }}
          SM_KEYSTORE_PASSWORD: ${{ secrets.SM_KEYSTORE_PASSWORD }}
        run: |
          CLEAN_KEY="$(printf '%s' "$SM_KEYSTORE_B64" | tr -d ' \r\t' | grep -oE '[A-Za-z0-9+/]{1000,}={0,2}' | head -1)"
          echo "Signing key text length after cleanup: ${#CLEAN_KEY} (expected 3564)"
          printf '%s' "$CLEAN_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SM_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -list -v -keystore "$SM_KEYSTORE_PATH" -storepass "$SM_KEYSTORE_PASSWORD" -alias spendmeter | grep "SHA1:"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SpendMeter.apk"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: SpendMeter-apk
          path: SpendMeter.apk
      - name: Publish on Releases page
        if: steps.check.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Spend Meter 1.0.${{ github.run_number }}
          body: Open this page on your Android phone and tap SpendMeter.apk to download and install.
          files: SpendMeter.apk
          make_latest: true
